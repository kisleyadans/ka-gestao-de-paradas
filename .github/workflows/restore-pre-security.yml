name: Restaurar versao anterior a seguranca

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar codigo e regras preservando temporariamente os fluxos
        shell: bash
        run: |
          set -euo pipefail
          target="fe773cd2841352c9b096c3856917e6e1ec6e3e2c"
          expected_tree="cf486839bb4671532e2ff92ec620c1ba55725bc9"
          current="$(git rev-parse HEAD)"
          current_workflows_tree="$(git rev-parse HEAD:.github/workflows)"
          target_tree="$(git rev-parse "$target^{tree}")"
          test "$target_tree" = "$expected_tree"
          git config user.name "kisleyadans"
          git config user.email "52387882+kisleyadans@users.noreply.github.com"
          git read-tree "$target_tree"
          while IFS= read -r path; do
            git update-index --force-remove "$path"
          done < <(git ls-files '.github/workflows/*')
          git read-tree --prefix=.github/workflows/ "$current_workflows_tree"
          if git diff --cached --name-only "$current" | grep -q '^.github/workflows/'; then
            echo "Os fluxos nao foram preservados nesta etapa."
            exit 1
          fi
          staged_tree="$(git write-tree)"
          restored="$(printf '%s\n' 'Restaurar codigo e regras anteriores a seguranca; fluxos ajustados separadamente' | git commit-tree "$staged_tree" -p "$current")"
          git push origin "$restored:refs/heads/main"
