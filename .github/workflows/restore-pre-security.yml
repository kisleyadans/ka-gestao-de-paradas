name: Restaurar versao anterior a seguranca

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar codigo e regras anteriores preservando historico
        shell: bash
        run: |
          set -euo pipefail
          target="fe773cd2841352c9b096c3856917e6e1ec6e3e2c"
          expected_tree="cf486839bb4671532e2ff92ec620c1ba55725bc9"
          current="$(git rev-parse HEAD)"
          target_tree="$(git rev-parse "$target^{tree}")"
          test "$target_tree" = "$expected_tree"
          restored="$(printf '%s\n' 'Restaurar versao anterior a seguranca, preservando dados e historico' | git commit-tree "$target_tree" -p "$current")"
          git push origin "$restored:refs/heads/main"
          echo "restored_commit=$restored" >> "$GITHUB_OUTPUT"
